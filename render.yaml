services:
  - type: web
    name: social-network-client
    runtime: node
    plan: free
    rootDir: Client
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://social-backend.bijancob.io.vn
      - key: API_BASE_URL
        value: https://social-backend.bijancob.io.vn
